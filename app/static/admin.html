<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Sidestash</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/sf-pro-text-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/sf-pro-text-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/sf-pro-display-bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* SF Pro Text below 20px, SF Pro Display from 20px up, SF Mono for identifiers (built by scripts/build-fonts.py) */
@font-face{font-family:"SF Pro Text";font-weight:400;font-display:swap;src:url(/fonts/sf-pro-text-regular.woff2) format("woff2")}
@font-face{font-family:"SF Pro Text";font-weight:500;font-display:swap;src:url(/fonts/sf-pro-text-medium.woff2) format("woff2")}
@font-face{font-family:"SF Pro Text";font-weight:600;font-display:swap;src:url(/fonts/sf-pro-text-semibold.woff2) format("woff2")}
@font-face{font-family:"SF Pro Text";font-weight:700;font-display:swap;src:url(/fonts/sf-pro-text-bold.woff2) format("woff2")}
@font-face{font-family:"SF Pro Display";font-weight:600;font-display:swap;src:url(/fonts/sf-pro-display-semibold.woff2) format("woff2")}
@font-face{font-family:"SF Pro Display";font-weight:700;font-display:swap;src:url(/fonts/sf-pro-display-bold.woff2) format("woff2")}
@font-face{font-family:"SF Mono";font-weight:400;font-display:swap;src:url(/fonts/sf-mono-regular.woff2) format("woff2")}
/* Product-page look: big rounded icons, bold titles, pill buttons, gray secondary text,
   thin separators, blue only for things you can press. System font, nothing downloaded. */
:root{
  --bg:#ffffff; --bg-2:#f5f5f7; --fill:#ececf0; --sep:#d2d2d7; --sep-soft:#e8e8ed;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
  --accent:#0071e3; --accent-pressed:#0062c4; --on-accent:#ffffff; --pill:#f0f0f5;
  --green:#248a3d; --orange:#b25000; --red:#d70015;
  --bar:rgba(255,255,255,.82);
  --font:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --font-display:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --icon-radius:22.5%; --icon-edge:rgba(0,0,0,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --bg-2:#161617; --fill:#232326; --sep:#424245; --sep-soft:#2c2c2e;
    --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#86868b;
    --accent:#2997ff; --accent-pressed:#0a84ff; --on-accent:#ffffff; --pill:#2c2c2e;
    --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
    --bar:rgba(22,22,23,.82); --icon-edge:rgba(255,255,255,.22); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.47 var(--font);letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
[hidden]{display:none!important}

/* ---------- frame: sidebar on desktop, tab bar on phones ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg-2);border-right:1px solid var(--sep-soft);padding:22px 12px}
.brand{font:700 21px/1.2 var(--font-display);letter-spacing:-.02em;padding:0 10px 18px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-label{font-size:12px;font-weight:600;color:var(--text-3);padding:16px 10px 6px}
.side-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;min-height:36px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
.side-item:hover{background:var(--fill)}
.side-item[aria-current="true"]{background:var(--fill);color:var(--accent);font-weight:600}
.side-item svg{width:20px;height:20px;flex:none;color:var(--accent)}
.side-item .icon{width:24px;height:24px}
.side-item .meta{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:500}
.tabbar{display:none}
main{min-width:0;padding:34px clamp(20px,4vw,52px) 80px;max-width:1080px}

/* ---------- type ---------- */
.eyebrow{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.02em;margin:0 0 2px}
.large-title{font:700 34px/1.12 var(--font-display);letter-spacing:-.022em;margin:0}
.page-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.shelf{margin-top:38px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--sep)}
.shelf-head h2{font:700 22px/1.2 var(--font-display);letter-spacing:-.016em;margin:0}
.shelf-head .note{font-size:13px;color:var(--text-2)}
.back{display:inline-flex;align-items:center;gap:2px;font-size:15px;color:var(--accent);background:none;border:0;padding:0;margin:0 0 18px;cursor:pointer;min-height:32px}
.back::before{content:"";width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-right:6px}

/* ---------- buttons ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 16px;border:0;border-radius:980px;
  background:var(--pill);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.pill:hover{text-decoration:none;filter:brightness(.97)}
.pill.filled{background:var(--accent);color:var(--on-accent)}
.pill.filled:hover{background:var(--accent-pressed);filter:none}
.pill.danger{color:var(--red)}
.pill.large{min-height:36px;padding:0 20px;font-size:15px}
.pill:disabled,.pill.disabled{opacity:.4;cursor:default;pointer-events:none}
.text-btn{background:none;border:0;padding:0;color:var(--accent);font-size:15px;cursor:pointer;min-height:32px}
.text-btn:hover{text-decoration:underline}
.text-btn.small{font-size:13px;min-height:24px}

/* ---------- app icons ---------- */
.icon{border-radius:var(--icon-radius);object-fit:cover;background:var(--fill);flex:none;
  box-shadow:0 0 0 .5px var(--icon-edge)}
.icon.ph{display:grid;place-items:center;font-weight:600;color:var(--text-2)}
.icon.s{width:28px;height:28px;font-size:13px}
.icon.m{width:64px;height:64px;font-size:26px}
.icon.l{width:128px;height:128px;font-size:52px}

/* ---------- status: a dot and a word ---------- */
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.status.ok::before{background:var(--green)} .status.busy::before{background:var(--orange)} .status.bad::before{background:var(--red)}
.status.bad{color:var(--red)}
@media (prefers-reduced-motion:no-preference){ .status.busy::before{animation:blink 1.4s ease-in-out infinite} }
@keyframes blink{50%{opacity:.35}}

/* ---------- lockups: an app in a list ---------- */
.lockups{list-style:none;margin:0;padding:0}
.lockup{border-bottom:1px solid var(--sep-soft)}
.lockup:last-child{border-bottom:0}
.lockup-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0}
.lockup-name{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.02em;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.lockup-name:hover{text-decoration:underline}
.lockup-sub{font-size:13px;color:var(--text-2);margin-top:1px}
.lockup-lines{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.lockup-actions{display:flex;gap:8px;align-items:center}
.update-why{font-size:13px;color:var(--text-2)}
.pill .chevron{width:11px;height:11px;margin-right:-4px;transition:transform .2s}
.pill[aria-expanded="true"] .chevron{transform:rotate(180deg)}
.update-why a{white-space:nowrap}

/* ---------- product page header ---------- */
.product{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.product h1{font:700 32px/1.12 var(--font-display);letter-spacing:-.022em;margin:0}
.product .subtitle{font-size:19px;color:var(--text-2);margin:4px 0 0;letter-spacing:-.015em}
.product .dev{display:inline-block;font-size:15px;margin-top:6px}
.product .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.facts{display:flex;margin:28px 0 0;padding:14px 0;border-top:1px solid var(--sep-soft);border-bottom:1px solid var(--sep-soft);overflow-x:auto;scrollbar-width:none}
.facts::-webkit-scrollbar{display:none}
.fact{flex:1 0 auto;min-width:112px;padding:0 18px;text-align:center;border-left:1px solid var(--sep-soft)}
.fact:first-child{border-left:0}
.fact .k{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em}
.fact .v{font:600 19px/1.3 var(--font-display);color:var(--text-2);margin-top:2px;white-space:nowrap}
.fact .s{font-size:12px;color:var(--text-3);white-space:nowrap}

/* ---------- segmented control ---------- */
.segmented{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:26px 0 4px}
.segmented button{border:0;background:none;padding:6px 22px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text);min-height:30px}
.segmented button[aria-selected="true"]{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){ .segmented button[aria-selected="true"]{background:#636366} }

/* ---------- forms: grouped boxes ---------- */
.two-col{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:start}
.group{background:var(--bg-2);border-radius:18px;padding:20px}
.group + .group{margin-top:16px}
.group-title{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 14px}
.group-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.group-sub h4{margin:0;font-size:15px;font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid.three{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.grid.three > :first-child{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--text-2);min-width:0}
.field.wide{grid-column:1/-1}
.field small{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--text-3);letter-spacing:0}
.field input,.field select,.field textarea{width:100%;min-height:38px;padding:0 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;font-weight:400;letter-spacing:-.01em}
.field textarea{padding:9px 12px;min-height:110px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text);min-height:32px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check.wide{grid-column:1/-1}
.urlfield{display:flex;flex-flow:row wrap;gap:10px;align-items:flex-end}
.urlfield > .field{flex:1 1 240px}
.urlfield .pill{min-height:38px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.hint{font-size:13px;color:var(--text-2);margin:10px 0 0}
.callout{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:13px;color:var(--text-2);border:1px solid var(--sep-soft)}
.callout.bad{color:var(--red)}
.empty{color:var(--text-2);margin:0;padding:18px 0}
.err{color:var(--red);font-size:13px}
.progress{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:8px;display:none;flex-basis:100%}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.runform{background:var(--bg-2);border-radius:18px;padding:18px;margin:0 0 16px}
.runform .meta{font-size:13px;color:var(--text-2);margin:0 0 14px}

/* ---------- build run ---------- */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep-soft);font-size:15px;color:var(--text-3)}
.steps li:last-child{border-bottom:0}
.steps .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sep);flex:none;display:grid;place-items:center}
.steps li.done{color:var(--text)} .steps li.done .mark{background:var(--green);border-color:var(--green)}
.steps li.done .mark::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.steps li.now{color:var(--text);font-weight:600} .steps li.now .mark{border-color:var(--orange);border-width:2px}
.steps li.fail{color:var(--red);font-weight:600} .steps li.fail .mark{background:var(--red);border-color:var(--red)}
.history{list-style:none;margin:6px 0 0;padding:0}
.history li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--sep-soft);font-size:14px}

/* ---------- listing preview ---------- */
.preview{position:sticky;top:20px}
.preview .label{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px}
.pv{background:var(--bg);border:1px solid var(--sep-soft);border-radius:18px;padding:18px;overflow:hidden}
.pv-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.pv-name{font:700 20px/1.2 var(--font-display);letter-spacing:-.02em}
.pv-sub{font-size:14px;color:var(--text-2)}
.pv-dev{font-size:13px;color:var(--accent)}
.pv-shots{display:flex;gap:10px;overflow-x:auto;margin:16px -18px 0;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.pv-shots::-webkit-scrollbar{display:none}
.pv-shots img{height:220px;aspect-ratio:auto 392/696;object-fit:cover;border-radius:14px;flex:none;background:var(--fill);border:.5px solid var(--sep-soft);scroll-snap-align:start}
.pv h3{font:700 17px/1.2 var(--font-display);margin:18px 0 6px}
.pv-desc{font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.pv-new .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2)}
.pv-new p{white-space:pre-wrap;font-size:14px;margin:6px 0 0;max-height:160px;overflow:auto}

/* ---------- versions ---------- */
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed var(--sep);border-radius:18px;padding:22px;text-align:center;cursor:pointer;margin:18px 0 6px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop strong{font-size:15px}
.drop span{font-size:13px;color:var(--text-2)}
.drop .progress{width:100%}
.versions{list-style:none;margin:0;padding:0}
.versions li{padding:18px 0;border-bottom:1px solid var(--sep-soft)}
.versions li:last-child{border-bottom:0}
.versions li.hidden{opacity:.5}
.v-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.v-name{font-size:17px;font-weight:600;letter-spacing:-.02em}
.v-name .tag{margin-left:6px}
.v-date{font-size:14px;color:var(--text-2)}
.v-meta{font-size:13px;color:var(--text-2);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--text-2);background:var(--fill);border-radius:6px;padding:1px 7px;vertical-align:1px;letter-spacing:0}
.tag.ok{color:var(--green)}
.notes{white-space:pre-wrap;margin:10px 0;max-height:220px;overflow:auto;font-size:14px}
textarea.notes{width:100%;max-height:none;min-height:160px;resize:vertical;padding:10px 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg)}
.v-actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);max-width:calc(100vw - 32px);padding:11px 18px;border-radius:14px;
  background:rgba(29,29,31,.92);color:#f5f5f7;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red);color:#fff}

/* ---------- tablet ---------- */
@media (max-width:980px){
  /* minmax(0,…) so a wide child (the screenshot row) scrolls instead of widening the page */
  .two-col{grid-template-columns:minmax(0,1fr)}
  .preview{position:static;min-width:0}
}

/* ---------- phone ---------- */
@media (max-width:720px){
  .shell{display:block}
  .sidebar{display:none}
  main{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:6px 8px calc(env(safe-area-inset-bottom) + 4px);background:var(--bar);border-top:.5px solid var(--sep);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  .tabbar button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:46px;justify-content:center;font-size:10.5px;font-weight:500;color:var(--text-3);cursor:pointer}
  .tabbar button svg{width:26px;height:26px}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 76px)}
  .large-title{font-size:30px}
  .shelf{margin-top:30px}
  .shelf-head h2{font-size:20px}

  /* lockups: the pill drops under the text so names never squeeze */
  .lockup-row{grid-template-columns:auto minmax(0,1fr);row-gap:10px}
  .lockup-actions{grid-column:2}
  .icon.m{width:56px;height:56px}

  .product{grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
  .icon.l{width:96px;height:96px;font-size:40px}
  .product h1{font-size:24px}
  .product .subtitle{font-size:15px}
  .product .actions{margin-top:12px}
  .facts{margin-top:20px}
  .fact{min-width:96px;padding:0 12px}
  .fact .v{font-size:17px}
  .segmented{display:grid;width:100%}

  .group{padding:16px;border-radius:14px}
  .grid,.grid.three{grid-template-columns:1fr}
  /* 16px+ text in fields stops iOS from zooming in on focus */
  .field input,.field select,.field textarea{font-size:17px;min-height:44px}
  .pill{min-height:34px}
  .pill.large{min-height:44px;flex:1}
  .form-actions .pill{min-height:44px;flex:1 1 auto}
  .urlfield .pill{min-height:44px}
  .check{min-height:44px}
  .back{min-height:44px;margin-bottom:6px}
  .pv-shots img{height:200px}
  .v-actions .pill{min-height:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Sidestash</div>
    <nav class="side-nav" id="nav" aria-label="Pages"></nav>
  </aside>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let S = null;
let view = localStorage.getItem("view") || "";
const appTab = {};             // which part of each app page is showing: build, listing or versions
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSize = n => n > 1e9 ? (n/1e9).toFixed(2)+" GB" : (n/1e6).toFixed(1)+" MB";

/* Copy to the clipboard. navigator.clipboard only exists on HTTPS pages and localhost,
   and the dashboard is usually opened over plain HTTP on the LAN, so fall back to
   copying from a hidden text field. Returns false if neither works. */
async function copyText(text){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true } }catch{}
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";  // 16px: no zoom on iOS
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand("copy") }catch{}
  ta.remove();
  return ok;
}

function toast(msg, err=false){
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err?" err":"");
  clearTimeout(t._h); t._h = setTimeout(()=>t.className="toast", err?6000:2600);
}
async function api(path, opts={}){
  // X-Sidestash marks requests as coming from this dashboard (see _from_other_site in main.py)
  const headers = {"X-Sidestash": "1", ...(opts.body && !(opts.body instanceof FormData) ? {"Content-Type":"application/json"} : {})};
  const r = await fetch(path, {...opts, headers});
  if(!r.ok){ let m = r.statusText; try{ m = (await r.json()).detail || m }catch{} throw new Error(m) }
  return r.json();
}

function setView(v){ view = v; localStorage.setItem("view", v); render(); window.scrollTo(0,0); }

const vnum = v => (v.version.match(/\d+/g)||[]).map(Number);
function cmpVersion(a,b){ const x=vnum(a), y=vnum(b);
  for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(y[i]||0)-(x[i]||0); if(d) return d }
  return b.date.localeCompare(a.date); }
const versionsOf = bid => S.versions.filter(v=>v.bundleIdentifier===bid).sort(cmpVersion);
const buildsOf = bid => S.builds.filter(b=>b.bundleIdentifier===bid);

  return url ? `<img class="${cls}" alt="" src="${esc(url)}" onerror="this.outerHTML='${ph.replace(/"/g,"&quot;")}'">` : ph;
}
const field = (k,label,val,ph="",cls="") => `<label class="field ${cls}">${esc(label)}<input data-f="${k}" value="${esc(val)}" placeholder="${esc(ph)}" autocapitalize="off" autocorrect="off"></label>`;

function lastChecked(){

/* why an app shows under Updates: a new release, a newer App Store base, or a fork behind */
function updateReasons(a){
  const out = [], r = a.upstream?.release, f = a.upstream?.fork, st = a.appstore || {}, v = versionsOf(a.bundleIdentifier)[0];
  if(r?.newer) out.push(`<span class="update-why"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(a.name)} ${esc(r.version||r.tag)}</a> is out</span>`);
  if(st.version && v && cmpVersion(v, {version: st.version, date: v.date}) > 0)
    out.push(`<span class="update-why">${esc(a.base_app_name||"Base app")} ${esc(st.version)} is on the App Store</span>`);
  if(f?.parent && f.behind) out.push(`<span class="update-why">Fork is ${plural(f.behind,"commit")} behind ${esc(f.parent)}${f.compare_url?` · <a href="${esc(f.compare_url)}" target="_blank" rel="noopener">Changes</a>`:""}</span>`);
  return out;
}
function cardStatus(a){
  const b = buildsOf(a.bundleIdentifier)[0];
  const log = b?.run_url ? ` · <a href="${esc(b.run_url)}" target="_blank" rel="noopener">Log</a>` : "";
  if(b && ACTIVE(b)) return `<span class="status busy">${esc(STEPS[Math.min(stepIndex(b),3)])}${log}</span>`;
  if(b?.status==="failed") return `<span class="status bad">Build failed${log}</span>`;
  if(b?.status==="done") return `<span class="status ok">Published ${fmtDay(b.updated||b.started)}${log}</span>`;
  return "";
}
const CHEVRON = '<svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function lockup(a, kind){
  const b = a.build || {}, id = a.bundleIdentifier, running = buildsOf(id).some(ACTIVE);
  const ready = b.fork_repo && b.workflow, v = versionsOf(id)[0];
  const key = kind+":"+id, open = ready && openRuns.has(key);
  const sub = v ? [v.tweakVersion ? `${esc(a.name)} ${esc(v.tweakVersion)}` : "", `${esc(a.base_app_name||"Version")} ${esc(v.version)}`].filter(Boolean).join(" · ") : "Nothing published yet";
  const f = a.upstream?.fork;
  const lines = kind==="update" ? updateReasons(a) : [cardStatus(a)].filter(Boolean);
  const hasUrl = /data-upfor/.test(inputsMarkup(a));
  const buttons = [
    kind==="update" && f?.behind && S.github_ready ? `<button class="pill" data-sync="${esc(id)}">Sync fork</button>` : "",
    ready ? `<button class="pill" data-toggle-run="${esc(key)}" aria-expanded="${open}" ${running?"disabled":""}>${running?"Building":`${kind==="update"?"Update":"Build"}${CHEVRON}`}</button>`
          : kind==="app" ? `<button class="pill" data-view="app:${esc(id)}">Set up</button>` : "",
  ].join("");
  return `<li class="lockup" data-card="${esc(id)}">
    <div class="lockup-row">${iconImg(iconFor(a),a.name,"icon m")}
      <div style="min-width:0"><button class="lockup-name" data-view="app:${esc(id)}">${esc(a.name)}</button>
        <div class="lockup-sub num">${sub}</div>
        ${lines.length?`<div class="lockup-lines" ${kind==="app"?`data-status="${esc(id)}"`:""}>${lines.join("")}</div>`:kind==="app"?`<div class="lockup-lines" data-status="${esc(id)}"></div>`:""}</div>
      <div class="lockup-actions">${buttons}</div></div>
    ${open ? `<div class="runform" data-runform="${esc(id)}">
        <p class="meta">${esc(b.fork_repo)} · ${esc(b.ref||"main")} · ${esc(b.workflow)}</p>
        ${inputsMarkup(a)}
        ${hasUrl && !S.public_reachable ? `<p class="callout">Uploads give GitHub a link on ${esc(S.public_url)}, which it can't reach. Set PUBLIC_URL to your public address, or paste a link from elsewhere.</p>` : ""}
        <div class="form-actions"><button class="pill filled large" data-run="${esc(id)}" ${!S.github_ready||running?"disabled":""}>Start build</button></div>
      </div>` : ""}
  </li>`;
}
function wireHome(){
  $$("[data-toggle-run]").forEach(btn=>btn.onclick=()=>{
    const key = btn.dataset.toggleRun;
    openRuns.has(key) ? openRuns.delete(key) : openRuns.add(key);
    render();
  });
  $$("[data-run]").forEach(btn=>btn.onclick=async()=>{
    const id = btn.dataset.run, root = btn.closest("[data-runform]");
    btn.disabled = true;
    try{
      const {build, inputs} = actionsBody(id, root);
      await api(`/api/apps/${id}`, {method:"PUT", body: JSON.stringify({build})});
      await api(`/api/apps/${id}/build`, {method:"POST", body: JSON.stringify({inputs})});
      toast(`${S.apps[id].name}: build started`);
      openRuns.delete("app:"+id); openRuns.delete("update:"+id);
    }catch(e){ toast(e.message,true); btn.disabled = false; return }
    load();
  });
  // fetch each app's workflow inputs once, if they aren't known yet
  Object.values(S.apps).forEach(a=>{ const b = a.build||{}, key = [a.bundleIdentifier,b.fork_repo,b.workflow,b.ref||"main"].join("|");
    if(b.fork_repo && b.workflow && S.github_ready && !schemaFor(b) && !wfTried.has(key)){ wfTried.add(key); loadWorkflow(a.bundleIdentifier, true) } });
}
/* status lines refresh while builds run, without touching open forms */
function refreshHome(){
  Object.values(S.apps).forEach(a=>{
    const el = $(`[data-status="${CSS.escape(a.bundleIdentifier)}"]`); if(el) el.innerHTML = cardStatus(a);
    const running = buildsOf(a.bundleIdentifier).some(ACTIVE);
    $$(`[data-run="${CSS.escape(a.bundleIdentifier)}"]`).forEach(btn=>{ btn.disabled = !S.github_ready || running });
  });
  renderNav(sortedApps());
}

/* ---------------- GitHub Actions form ---------------- */
/* the inputs, shared by the app page and the overview's run forms */
function inputsMarkup(a){
  const b = a.build || {inputs:{}};
  if(schemaFor(b)) return schemaInputs(b);
  const inputs = Object.entries(b.inputs||{});
  const isBool = v => v==="true" || v==="false";
  if(!inputs.length) return `<p class="empty" style="padding:4px 0">${b.fork_repo&&b.workflow ? (wfErrors[a.bundleIdentifier] ? `<span class="err">${esc(wfErrors[a.bundleIdentifier])}</span>` : "Reading the workflow's inputs…") : "Fill in your fork and workflow file, then save. Its inputs appear here."}</p>`;
  return `<div class="grid">${inputs.map(([k,v])=> isBool(v)
    ? `<label class="field">${esc(k)}<select data-in="${esc(k)}"><option ${v==="true"?"selected":""}>true</option><option ${v==="false"?"selected":""}>false</option></select></label>`
    : /url/i.test(k) ? urlField(k, esc(k), v, "Paste a link or upload the decrypted .ipa")
    : `<label class="field">${esc(k)}<input data-in="${esc(k)}" value="${esc(v)}" spellcheck="false" autocapitalize="off" placeholder="Blank uses the workflow default"></label>`).join("")}</div>`;
}
/* a link field with an Upload button: the server stores the file and fills in a private link */
function urlField(name, labelHtml, value, placeholder){
  return `<div class="field wide urlfield"><label class="field">${labelHtml}
      <input data-in="${esc(name)}" value="${esc(value)}" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="url" placeholder="${esc(placeholder)}"></label>
    <label class="pill upbtn">Upload .ipa<input type="file" accept=".ipa" hidden data-upfor="${esc(name)}"></label>
    <div class="progress"><i></i></div></div>`;
}
function actionsForm(a){
  const b = a.build || {inputs:{}};
  const running = buildsOf(a.bundleIdentifier).some(ACTIVE);
  return `
    <h3 class="group-title">Workflow</h3>
    <div class="grid three">
      ${field("build.fork_repo","Your fork",b.fork_repo,"you/"+(a.github_repo||"repo").split("/").pop())}
      ${field("build.workflow","Workflow file",b.workflow,"build.yml")}
      ${field("build.ref","Branch",b.ref||"main")}

    ${b.fork_repo && a.upstream ? `<div style="margin-top:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">${forkLine(a)}</div>` : ""}

      <button class="pill large" data-act="saveActions">Save without building</button>
    </div>
    ${!S.github_ready?`<p class="callout bad">Builds are off. Set GITHUB_TOKEN on the container, then restart it.</p>`
      : schemaFor(b) ? "" : `<p class="hint">Blank link fields use the workflow's own default, if it has one.</p>`}`;
}
/* inputs read from the workflow file itself (POST /api/apps/:id/workflow) */
const wfErrors = {}, wfTried = new Set();
const schemaFor = b => { const s = b.schema;
  return s && s.fork_repo===b.fork_repo && s.workflow===b.workflow && s.ref===(b.ref||"main") ? s : null };
function schemaInputs(b){
  const s = schemaFor(b);
  if(!s.inputs.length) return `<p class="empty" style="padding:4px 0">This workflow takes no inputs.</p>`;
  const val = i => (b.inputs||{})[i.name] ?? i.default;
  const label = i => `${esc(i.description||i.name)}${i.required?" (required)":""}<small>${esc(i.name)}</small>`;
  return `<div class="grid">${s.inputs.map(i=>{
    const v = val(i);
    if(i.type==="boolean") return `<label class="check wide"><input type="checkbox" data-in="${esc(i.name)}" ${v==="true"?"checked":""}> ${esc(i.description||i.name)}</label>`;
    if(i.type==="choice") return `<label class="field">${label(i)}<select data-in="${esc(i.name)}">${i.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
    if(/url|link/i.test(i.name) || /\b(url|link)\b/i.test(i.description||""))
      return urlField(i.name, label(i), v, i.default ? "Default: "+i.default : "Paste a link or upload the .ipa");
    const wide = (i.description||"").length > 40;
    return `<label class="field ${wide?"wide":""}">${label(i)}<input data-in="${esc(i.name)}" value="${esc(v)}" spellcheck="false" autocapitalize="off"
      ${i.type==="number"?'inputmode="decimal"':""} placeholder="${i.default?"Default: "+esc(i.default):i.required?"Required":"Optional"}"></label>`;
  }).join("")}</div>`;
}
async function loadWorkflow(appId, quiet=false){
  try{ await api(`/api/apps/${appId}/workflow`, {method:"POST"}); delete wfErrors[appId]; if(!quiet) toast("Inputs loaded from the workflow") }
  catch(e){ wfErrors[appId] = e.message; if(!quiet) toast(e.message,true) }
  return load();
}
function forkLine(a, withButton=true){
  const u = a.upstream || {}, f = u.fork;
  const errs = (u.errors||[]).map(e=>`<span class="err" style="flex-basis:100%">${esc(e)}</span>`).join("");
  if(!f) return errs;
  if(!f.parent) return `<span class="muted">${esc(f.note||"")}</span>${errs}`;
  if(f.behind==null) return `<span class="muted">Couldn't compare with ${esc(f.parent)}.</span>${errs}`;
  const where = `${esc(f.ref)} vs ${esc(f.parent)}:${esc(f.parent_branch)}`;
  if(!f.behind) return `<span class="status ok">Fork up to date</span><span class="muted">${where}${f.ahead?` · ${plural(f.ahead,"commit")} of your own`:""}</span>${errs}`;
  return `<span class="status busy">Fork ${plural(f.behind,"commit")} behind</span>
    <span class="muted">${where}${f.compare_url?` · <a href="${esc(f.compare_url)}" target="_blank" rel="noopener">Changes</a>`:""}</span>
    ${withButton&&S.github_ready?`<button class="pill" data-sync="${esc(a.bundleIdentifier)}">Sync fork</button>`:""}${errs}`;
}

const STEPS = ["Start the workflow on GitHub","Build on GitHub","Download the .ipa","Publish to the source"];
function stepIndex(b){
  if(b.status==="done") return 4;
  if(b.status==="importing") return 2;
  if(b.status==="failed") return !b.run_id ? 0 : b.conclusion==="success" ? 2 : 1;
  return b.run_id ? 1 : 0;
}
function runsPanel(a){
  const builds = buildsOf(a.bundleIdentifier);
  if(!builds.length) return `<h3 class="group-title">Last build</h3><p class="empty" style="padding:4px 0">No builds yet.</p>`;
  const cur = builds[0], idx = stepIndex(cur), failed = cur.status==="failed";
  const steps = STEPS.map((s,i)=>{
    const state = i<idx ? "done" : i===idx ? (failed?"fail":(cur.status==="done"?"done":"now")) : "";
    return `<li class="${state}"><span class="mark"></span><span>${esc(s)}</span></li>`}).join("");
  const result = cur.status==="done" ? `Published ${cur.imported.map(i=>esc(i.version)+(i.duplicate?" (already published)":"")).join(" and ")}.` : "";
  const older = builds.slice(1,6);
  return `<h3 class="group-title" style="margin-bottom:2px">${ACTIVE(cur)?"Building now":"Last build"}</h3>
    <p class="muted" style="font-size:13px;margin:0 0 8px">Started ${fmtDate(cur.started)}</p>
    <ol class="steps">${steps}</ol>
    ${failed?`<p class="err" style="margin:10px 0 0">${esc(cur.error||"The build failed.")}</p>`:""}
    ${result?`<p style="color:var(--green);font-size:14px;margin:10px 0 0">${result}</p>`:""}
    <div class="form-actions" style="margin-top:14px">
      ${cur.run_url?`<a class="pill" href="${esc(cur.run_url)}" target="_blank" rel="noopener">Open log on GitHub</a>`:""}
      ${failed?`<button class="pill" data-retry="${cur.id}">Check again</button>`:""}
    </div>
    ${older.length?`<div class="group-sub"><h4>Earlier builds</h4></div><ul class="history">${older.map(b=>{
      const st = b.status==="done"?'<span class="status ok">Published</span>':b.status==="failed"?'<span class="status bad">Failed</span>':'<span class="status busy">Running</span>';
      return `<li><span class="num">${fmtDate(b.started)}</span><span>${st}${b.run_url?` · <a href="${esc(b.run_url)}" target="_blank" rel="noopener">Log</a>`:""}</span></li>`}).join("")}</ul>`:""}`;
}

/* AltStore only knows a fixed set of categories, so pick from them; blank follows the App Store */
/* the category id you picked ("Social" and "social" both count), or "" for automatic */
function chosenCategory(a){
  const names = S.categories, cur = (a.category||"").toLowerCase();
  return names[cur] ? cur : Object.keys(names).find(k=>names[k].toLowerCase()===cur) || "";
}
function categoryField(a){
  const names = S.categories, chosen = chosenCategory(a);
  return `<label class="field">Category<select data-f="category">
    <option value="" ${chosen?"":"selected"}>Automatic (${esc(names[a.category_auto]||"Other")}, from the App Store)</option>
    ${Object.entries(names).map(([id,name])=>`<option value="${id}" ${id===chosen?"selected":""}>${esc(name)}</option>`).join("")}
  </select></label>`;
}

function renderPreview(a){
  const f = collect($("#listing"));
  const latest = versionsOf(a.bundleIdentifier).find(v=>v.published);
  const shots = (f.screenshots && f.screenshots.length) ? f.screenshots : (f.use_appstore_screenshots ? (a.appstore?.screenshotUrls||[]) : []);
  $("#preview").innerHTML = `<div class="pv">
    <div class="pv-head">${iconImg(f.iconURL || a.appstore?.artworkUrl512 || "", f.name, "icon m")}
      <div style="min-width:0"><div class="pv-name">${esc(f.name||"Untitled")}</div><div class="pv-sub">${esc(f.subtitle)}</div><div class="pv-dev">${esc(f.developerName)}</div></div></div>
    ${shots.length?`<div class="pv-shots">${shots.slice(0,8).map(u=>`<img alt="" src="${esc(u)}">`).join("")}</div>`:""}
    ${f.localizedDescription?`<p class="pv-desc" style="margin-top:16px">${esc(f.localizedDescription)}</p>`:""}
    <div class="pv-new"><h3>What's new</h3>${latest
      ? `<div class="meta num"><span>Version ${esc(latest.version)}</span><span>${fmtDay(latest.date)}</span></div><p>${esc(latest.localizedDescription)}</p>`
      : `<div class="meta">Nothing published yet</div>`}</div></div>`;
}

/* ---------------- versions ---------------- */
function versionsList(a){
  const vs = versionsOf(a.bundleIdentifier);
  if(!vs.length) return `<p class="empty">Nothing published yet. Run a build or upload an .ipa.</p>`;
  const firstLive = vs.find(v=>v.published);
  return `<ol class="versions">${vs.map(v=>{
    const rel = v.github_release, store = v.appstore_notes, isLatest = v===firstLive;
    const from = [rel?`<a href="${esc(rel.url)}" target="_blank" rel="noopener">GitHub ${esc(rel.tag)}</a>${rel.matched?"":" (closest release)"}`:"",
                  store?`App Store notes for ${esc(store.version)}`:""].filter(Boolean).join(" · ");
    return `<li class="${v.published?"":"hidden"}" data-vid="${v.id}">
      <div class="v-head"><div class="v-name num">${esc(v.version)}${v.published?(isLatest?'<span class="tag ok">Latest</span>':""):'<span class="tag">Hidden</span>'}</div>
        <div class="v-date num">${fmtDay(v.date)}</div></div>
      <div class="v-meta num">${v.tweakVersion?`${esc(a.name)} ${esc(v.tweakVersion)} · `:""}${fmtSize(v.size)} · iOS ${esc(v.minOSVersion||"?")} or later · ${v.origin?.startsWith("actions")?"Built on GitHub":"Uploaded"}${from?" · "+from:""}</div>
      <div class="notes" data-notes>${esc(v.localizedDescription)}</div>
      <div class="v-actions">
        <button class="pill" data-vact="edit">Edit notes</button>
        <button class="pill" data-vact="refresh">Re-pull changelogs</button>
        <button class="pill" data-vact="toggle">${v.published?"Hide":"Publish"}</button>
        <a class="pill" href="/ipa/${esc(v.file)}">Download</a>
        <button class="pill danger" data-vact="delete">Delete</button>
      </div></li>`}).join("")}</ol>`;
}

/* ---------------- add app ---------------- */
function newAppView(){
  return `<div class="page-top"><div><p class="eyebrow">Manage</p><h1 class="large-title">Add app</h1></div></div>
  <section class="shelf">${shelfHead("Upload its .ipa", `<span class="note">Fastest</span>`)}

    <label class="drop" id="drop" tabindex="0"><input type="file" accept=".ipa" id="ipaFile" hidden>
      <strong>Drop an .ipa here</strong><span>or choose a file</span>
      <div class="progress" id="prog"><i></i></div></label>
  </section>
  <section class="shelf">${shelfHead("Or set it up first")}
    <p class="hint">For an app you'll build on GitHub. You add your fork and workflow on its page.</p>
    <div class="group" id="newApp" style="margin-top:16px">
      <div class="grid">
        ${field("bundleIdentifier","Bundle ID of the base app","","com.example.app")}
        ${field("name","Name","","Tweak name")}
        ${field("github_repo","Original repo, for changelogs","","owner/repo")}

      </div>
      <div class="form-actions"><button class="pill filled large" data-act="createApp">Add app</button></div>

}
function wireDrop(onDone){
  const zone = $("#drop"), input = $("#ipaFile");
  if(!zone) return;
  zone.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click() } };
  const handle = async f => {
    try{ const v = await uploadWithProgress("/api/upload", f);
      toast(v.duplicate ? "That exact file is already published." : `Published ${v.version}`);
      if(onDone(v)) return; }
    catch(e){ toast(e.message,true) } load();
  };
  input.onchange = () => input.files[0] && handle(input.files[0]);
  ["dragenter","dragover"].forEach(t=>zone.addEventListener(t,e=>{e.preventDefault();zone.classList.add("over")}));
  ["dragleave","drop"].forEach(t=>zone.addEventListener(t,e=>{e.preventDefault();zone.classList.remove("over")}));
  zone.addEventListener("drop", e=>{ const f=e.dataTransfer.files[0]; f && handle(f) });
}

/* ---------------- interactions ---------------- */
function collect(root){
  const out = {};
  $$("[data-f]", root).forEach(el=>{
    let v = el.type==="checkbox" ? el.checked : el.value;
    if(el.dataset.f==="screenshots") v = v.split("\n").map(x=>x.trim()).filter(Boolean);
    const [k, sub] = el.dataset.f.split(".");
    if(sub){ out[k] = out[k] || {}; out[k][sub] = v } else out[k] = v;
  });
  return out;
}
function actionsBody(appId, root=$("#actions")){
  const f = collect(root), inputs = {};
  $$("[data-in]", root).forEach(i=>inputs[i.dataset.in]= i.type==="checkbox" ? String(i.checked) : i.value.trim());
  const cur = S.apps[appId].build || {};
  return {build: {...cur, ...f.build, inputs: {...cur.inputs, ...inputs}}, inputs};
}
function uploadWithProgress(url, file, bar=$("#prog")){
  return new Promise((resolve,reject)=>{
    const fd = new FormData(); fd.append("file", file);
    const xhr = new XMLHttpRequest(); xhr.open("POST", url); xhr.setRequestHeader("X-Sidestash", "1");
    if(bar) bar.style.display="block";
    xhr.upload.onprogress = e => { if(bar && e.lengthComputable) bar.firstElementChild.style.width = (e.loaded/e.total*100)+"%" };
    xhr.onload = () => { let j={}; try{ j = JSON.parse(xhr.responseText) }catch{}
      xhr.status<300 ? resolve(j) : reject(new Error(j.detail || "Upload failed ("+xhr.status+")")) };
    xhr.onerror = () => reject(new Error("Upload interrupted. Large files can hit reverse-proxy limits; use the server's LAN address."));
    xhr.send(fd);
  });
}
/* Upload .ipa buttons next to link fields */
function wireUploads(){
  $$("[data-upfor]").forEach(inp=>inp.onchange=async()=>{
    const f = inp.files[0]; if(!f) return;
    const wrap = inp.closest(".urlfield"), target = $(`[data-in="${CSS.escape(inp.dataset.upfor)}"]`, wrap), bar = $(".progress", wrap);
    const btn = inp.closest(".upbtn"); btn.classList.add("disabled");
    try{
      const u = await uploadWithProgress("/api/uploads", f, bar);
      target.value = u.url;
      toast(`Uploaded ${u.bundleIdentifier||f.name} ${u.version||""}. The link is filled in.`);
      if(!S.public_reachable) toast(`GitHub can't reach ${S.public_url}. This link only works once the server is public.`, true);
    }catch(e){ toast(e.message,true) }
    btn.classList.remove("disabled"); bar.style.display="none"; inp.value="";
  });
}

function wire(){
  $$("[data-copy]").forEach(b=>b.onclick=async()=>{
    if(await copyText(b.dataset.copy)) toast("Source link copied");
    else { window.prompt("Copy the source link:", b.dataset.copy) }
  });
  $$("#main [data-view]").forEach(el=>el.onclick=e=>{ e.preventDefault(); setView(el.dataset.view) });
  const appId = view.startsWith("app:") ? view.slice(4) : null;

  if(appId){
    const a = S.apps[appId];
    // switch between Build, Listing and Versions without re-rendering, so typed values stay
    $$("[data-seg]").forEach(btn=>btn.onclick=()=>{
      const tab = appTab[appId] = btn.dataset.seg;
      $$(".segmented [data-seg]").forEach(s=>s.setAttribute("aria-selected", String(s.dataset.seg===tab)));
      $$("[data-panel]").forEach(p=>p.hidden = p.dataset.panel!==tab);
      if(btn.hasAttribute("data-focus-run")) $("#actions").scrollIntoView({behavior:"smooth", block:"start"});
    });
    renderPreview(a);
    $("#listing").addEventListener("input", ()=>renderPreview(a));
    wireDrop(v => { if(!v.duplicate && v.bundleIdentifier!==appId){ load().then(()=>setView("app:"+v.bundleIdentifier)); return true } });
    const icon = $("#iconFile");
    icon.onchange = async()=>{ try{ await uploadWithProgress(`/api/apps/${appId}/icon`, icon.files[0]); toast("Icon updated") }catch(e){ toast(e.message,true) } load() };
    wireLive();
    const b = a.build || {};
    const key = [appId, b.fork_repo, b.workflow, b.ref||"main"].join("|");
    if(b.fork_repo && b.workflow && S.github_ready && !schemaFor(b) && !wfTried.has(key)){ wfTried.add(key); loadWorkflow(appId, true) }
  }
  if(view==="home") wireHome();
  wireUploads();
  $$("[data-sync]").forEach(btn=>btn.onclick=async()=>{
    const a = S.apps[btn.dataset.sync], f = a.upstream.fork;
    if(!confirm(`Pull ${plural(f.behind,"commit")} from ${f.parent} into ${a.build.fork_repo} (${f.ref})?\n\nThis changes your fork on GitHub, like its Sync fork button.`)) return;
    btn.disabled = true;
    try{ const r = await api(`/api/apps/${a.bundleIdentifier}/sync`, {method:"POST"}); toast(r.steps.join(" ")) }
    catch(e){ toast(e.message,true) }
    load();
  });
  if(view==="new") wireDrop(v => { load().then(()=>setView("app:"+v.bundleIdentifier)); return true });

  $$("[data-act]").forEach(btn=>btn.onclick=async()=>{
    const act = btn.dataset.act; btn.disabled = true;
    try{
      if(act==="checkUpdates"){
        const ids = Object.keys(S.apps);
        await Promise.all([api("/api/updates/check", {method:"POST"}),
          ...ids.map(id=>api(`/api/apps/${id}/appstore`, {method:"POST"}).catch(()=>{}))]);
        toast("Checked releases, forks and the App Store");
      }
      if(act==="loadWorkflow"){ await api(`/api/apps/${appId}`, {method:"PUT", body: JSON.stringify({build: actionsBody(appId).build})}); return loadWorkflow(appId) }
      if(act==="saveActions"){ await api(`/api/apps/${appId}`, {method:"PUT", body: JSON.stringify({build: actionsBody(appId).build})}); toast("Saved") }
      if(act==="build"){
        const {build, inputs} = actionsBody(appId);
        await api(`/api/apps/${appId}`, {method:"PUT", body: JSON.stringify({build})});
        await api(`/api/apps/${appId}/build`, {method:"POST", body: JSON.stringify({inputs})});
        toast("Build started on GitHub");
      }
      if(act==="saveListing"){ await api(`/api/apps/${appId}`, {method:"PUT", body: JSON.stringify(collect($("#listing")))}); toast("Listing saved") }
      if(act==="appstore"){ const i = await api(`/api/apps/${appId}/appstore`, {method:"POST"}); toast(`App Store: ${i.trackName} ${i.version}`) }
      if(act==="deleteApp"){ if(!confirm("Remove this app from the dashboard?")) { btn.disabled=false; return }
        await api(`/api/apps/${appId}`, {method:"DELETE"}); view = "" }
      if(act==="createApp"){
        const a = await api("/api/apps", {method:"POST", body: JSON.stringify(collect($("#newApp")))});
        toast(`Added ${a.name}`); await load(); return setView("app:"+a.bundleIdentifier);
      }
      if(act==="saveSource"){ await api("/api/source", {method:"PUT", body: JSON.stringify(collect($("#sourceForm")))}); toast("Source saved") }
    }catch(e){ toast(e.message,true); btn.disabled = false; return }
    btn.disabled = false; load();
  });
}

/* parts that refresh while a build runs, without touching the forms */
function wireLive(){
  $$("#runs [data-retry]").forEach(b=>b.onclick=async()=>{ try{ await api(`/api/builds/${b.dataset.retry}/retry`,{method:"POST"}); toast("Checking the run again") }catch(e){ toast(e.message,true) } refreshLive() });
  $$("#versions [data-vact]").forEach(btn=>btn.onclick=async()=>{
    const li = btn.closest("li"), vid = li.dataset.vid, v = S.versions.find(x=>x.id===vid), act = btn.dataset.vact;
    try{
      if(act==="edit"){
        const box = $("[data-notes]", li);
        if(box.tagName==="TEXTAREA"){ await api(`/api/versions/${vid}`, {method:"PATCH", body: JSON.stringify({localizedDescription: box.value})}); toast("Notes saved"); return refreshLive() }
        const ta = document.createElement("textarea"); ta.className="notes"; ta.dataset.notes=""; ta.value = v.localizedDescription||"";
        box.replaceWith(ta); ta.focus(); btn.textContent = "Save notes"; return;
      }
      if(act==="refresh"){ btn.disabled=true; await api(`/api/versions/${vid}/refresh`, {method:"POST"}); toast("Changelogs updated") }
      if(act==="toggle"){ await api(`/api/versions/${vid}`, {method:"PATCH", body: JSON.stringify({published: !v.published})}) }
      if(act==="delete"){ if(!confirm(`Delete ${v.version} and its .ipa file? This can't be undone.`)) return;
        await api(`/api/versions/${vid}`, {method:"DELETE"}); toast("Deleted") }
    }catch(e){ toast(e.message,true) }
    refreshLive();
  });
}

async function refreshLive(){
  const prev = S;
  S = await api("/api/state");
  if(view==="home"){
    const done = prev.builds.filter(ACTIVE).map(b=>S.builds.find(x=>x.id===b.id)).filter(b=>b && !ACTIVE(b));
    done.forEach(b=>{ const n = S.apps[b.bundleIdentifier]?.name || "Build";
      b.status==="done" ? toast(`${n}: published to the source`) : toast(`${n}: the build failed`, true) });
    refreshHome(); return schedulePoll();
  }
  // Add app and Source are forms: never re-draw them, or what you've typed is lost.
  // Only the sidebar shows build state there.
  if(!view.startsWith("app:")){ renderNav(sortedApps()); return schedulePoll() }
  const a = S.apps[view.slice(4)];
  if(!a) return render();
  renderNav(sortedApps());
  $("#runs").innerHTML = runsPanel(a);
  const editing = $("#versions textarea");
  if(!editing) $("#versions").innerHTML = versionsList(a);
  // re-enable the Start button once the build is over, keeping typed inputs
  const wasRunning = prev.builds.some(b=>b.bundleIdentifier===a.bundleIdentifier && ACTIVE(b));
  const running = buildsOf(a.bundleIdentifier).some(ACTIVE);
  const runBtn = $('[data-act="build"]'); if(runBtn){ runBtn.disabled = !S.github_ready || running; runBtn.textContent = running ? "Building…" : "Start build" }
  if(wasRunning && !running){
    const b = buildsOf(a.bundleIdentifier)[0];
    b.status==="done" ? toast("Build published to the source") : toast("The build failed. See the run for details.", true);
  }
  renderPreview(a);
  wireLive();
  schedulePoll();
}

let pollTimer = null;
function schedulePoll(){
  clearTimeout(pollTimer);
  if(S.builds.some(ACTIVE)) pollTimer = setTimeout(()=>refreshLive().catch(()=>schedulePoll()), 8000);
}
load().catch(e=>{ $("#main").innerHTML = `<p class="empty">Couldn't load the dashboard: ${esc(e.message)}</p>` });
</script>
